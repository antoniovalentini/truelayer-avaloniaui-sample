name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create stub config files
        run: |
          touch src/MobileApp.Desktop/appsettings.json
          touch src/MobileApp.Desktop/ec512-private-key.pem
          touch src/MobileApp.Android/appsettings.json
          touch src/MobileApp.Android/ec512-private-key.pem

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build Desktop
        run: dotnet build src/MobileApp.Desktop/MobileApp.Desktop.csproj -c Release

      - name: Build Android
        run: dotnet build src/MobileApp.Android/MobileApp.Android.csproj -c Release
